<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════
  ページ: 購入完了（checkout-complete.html）
  Squareの決済ページから戻ってきた人が最初に見るページです。
  api/checkout.js の redirect_url（?order=<orders.id>）から遷移してきます。

  ▼ 仕組み
  URLの ?order= を js/checkout-complete.js が読み取り、/api/order-status を
  ポーリングして Square Webhook（api/webhooks/square.js）による支払い確認結果を
  実際に反映する。URLを直接開いた・注文IDが無い場合は確認できない旨を案内する。
  ═══════════════════════════════════════════════════
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ご購入ありがとうございました | TOKYO FASHION MARKET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"></header>

  <main>
    <div class="page-head">
      <h1>ご購入ありがとうございました</h1>
      <p class="page-sub">THANK YOU</p>
    </div>

    <section class="section">
      <div class="container container-narrow text-center">
        <div id="orderResult">
          <p class="section-lead">お支払いの確認をしています…</p>
        </div>
        <div class="section-more">
          <a href="index.html" class="btn btn-solid">ホームへ戻る</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/checkout-complete.js"></script>
</body>
</html>
