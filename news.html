<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════
  ページ: ニュース（news.html）
  ▼ このページで編集する場所
  ・記事の追加 → js/data.js の NEWS_ARTICLES（フィルタ・ページ送りは自動）

  ▼ 全ページ共通
  ・メニュー / フッター → js/layout.js
  ・色やサイズ → css/style.css（先頭の :root で色を一括変更可）
  ・記入する内容の一覧 → 指示テンプレート.txt
  ═══════════════════════════════════════════════════
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>ニュース | TOKYO FASHION MARKET</title>
  <!-- SEO:start（公開ドメインが決まったら vercel.json とこの canonical/og:url を実ドメインに一括置換） -->
  <meta name="description" content="TOKYO FASHION MARKET の最新ニュース・メディア掲載情報。イベントやキャンペーンのお知らせをお届けします。">
  <link rel="canonical" href="https://tokyo-fashion-market.vercel.app/news.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TOKYO FASHION MARKET">
  <meta property="og:title" content="ニュース | TOKYO FASHION MARKET">
  <meta property="og:description" content="TOKYO FASHION MARKET の最新ニュース・メディア掲載情報。イベントやキャンペーンのお知らせをお届けします。">
  <meta property="og:url" content="https://tokyo-fashion-market.vercel.app/news.html">
  <meta property="og:image" content="https://tokyo-fashion-market.vercel.app/img/ogp.jpg">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ニュース | TOKYO FASHION MARKET">
  <meta name="twitter:description" content="TOKYO FASHION MARKET の最新ニュース・メディア掲載情報。イベントやキャンペーンのお知らせをお届けします。">
  <meta name="twitter:image" content="https://tokyo-fashion-market.vercel.app/img/ogp.jpg">
  <!-- SEO:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="news">
  <header class="site-header"></header>

  <main>
    <div class="page-head">
      <h1>"TFM" NEWS</h1>
      <p class="page-sub">NEWS</p>
    </div>

    <section class="section">
      <div class="container container-narrow">
        <!-- カテゴリフィルタ -->
        <div class="news-tabs" id="newsTabs">
          <button type="button" class="news-tab is-active" data-cat="すべて">すべて</button>
          <button type="button" class="news-tab" data-cat="イベント">イベント</button>
          <button type="button" class="news-tab" data-cat="メディア">メディア</button>
          <button type="button" class="news-tab" data-cat="インフルエンサー">インフルエンサー</button>
          <button type="button" class="news-tab" data-cat="キャンペーン">キャンペーン</button>
        </div>

        <ul class="news-list" id="newsList"></ul>

        <div class="pagination" id="pagination">
          <button type="button" class="is-active">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
